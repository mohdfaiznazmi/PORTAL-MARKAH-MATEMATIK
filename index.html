<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Semakan Markah Peperiksaan</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .container {
            width: 90%;
            max-width: 950px;
            margin: 30px auto;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 12px 24px;
            border: none;
            background-color: #ddd;
            color: #333;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active {
            background-color: var(--secondary-color);
            color: white;
        }

        .card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: none;
        }

        .card.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="text"], input[type="password"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        input[type="text"] {
            text-transform: uppercase;
        }

        button.btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button.btn-submit:hover {
            background-color: #2980b9;
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            background-color: #f8f9fa;
            border-left: 5px solid var(--secondary-color);
            display: none;
        }

        .result-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: var(--primary-color);
            color: white;
        }

        .grade-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            background-color: #27ae60;
            color: white;
            font-weight: bold;
        }

        .error-msg {
            color: var(--accent-color);
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

    <header>

    <div class="container">
        <!-- Navigation Tabs -->

        </div>

            <h2>Semakan Markah Murid</h2>
            <hr style="margin: 15px 0;"><br>

            </div>

            <div class="form-group">
                <label for="exam-select">Pilih Peperiksaan:</label>
                <select id="exam-select">

                    <option value="PAT T4">PAT T4 (Pentaksiran Akhir Tahun T4)</option>
                    <option value="PPT">PPT (Pentaksiran Pertengahan Tahun T5)</option>
                    <option value="SPMC">SPMC (Percubaan SPM)</option>
                </select>
            </div>

            <button class="btn-submit" onclick="checkStudentMarks()">Semak Markah</button>
            
            <div id="student-error" class="error-msg"></div>

            <div id="student-result" class="result-box">
                <div class="result-header" id="res-student-info"></div>
                <table>
                    <thead>
                        <tr>
                            <th>Peperiksaan</th>
                            <th>Markah</th>
                            <th>Gred</th>
                        </tr>
                    </thead>
                    <tbody id="student-table-body"></tbody>
                </table>
            </div>
        </div>

        <div id="section-guru" class="card">
            <h2>Log Masuk Guru</h2>
            <hr style="margin: 15px 0;"><br>

            <div id="teacher-login-form">

                </div>
                <button class="btn-submit" onclick="teacherLogin()">Log Masuk</button>
                <div id="teacher-error" class="error-msg"></div>
            </div>

            <div id="teacher-dashboard" style="display: none;">

                <p>Status: <span style="color: green; font-weight: bold;">Log Masuk Berjaya</span></p>
                <button class="btn-submit" style="background-color: #7f8c8d; margin-top: 10px; width: auto; padding: 6px 15px;" onclick="teacherLogout()">Log Keluar</button>

                    <label for="class-filter">Tapis Mengikut Kelas:</label>
                    <select id="class-filter" onchange="renderTeacherData()">
                        <option value="ALL">Semua Kelas</option>

                        <option value="5 ERIS">5 ERIS</option>

                                <th>SPMC</th>
                            </tr>

                </div>

        const SECRET_TEACHER_CODE = "1449";

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.card').forEach(card => card.classList.remove('active'));

            if (tab === 'pelajar') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('section-pelajar').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('section-guru').classList.add('active');
            }
        }

        function checkStudentMarks() {
            const inputName = document.getElementById('student-name').value.trim().toUpperCase();
            const selectedExam = document.getElementById('exam-select').value;
            const errorDiv = document.getElementById('student-error');
            const resultBox = document.getElementById('student-result');
            const tbody = document.getElementById('student-table-body');
            const infoDiv = document.getElementById('res-student-info');

            errorDiv.innerText = "";
            resultBox.style.display = "none";
            tbody.innerHTML = "";

            if (!inputName) {
                errorDiv.innerText = "Sila masukkan nama penuh anda.";
                return;
            }

            const student = examDatabase[inputName];

            if (!student) {
                errorDiv.innerText = "Rekod pelajar tidak dijumpai. Sila pastikan ejaan nama penuh (huruf besar) mengikut kad pengenalan.";
                return;
            }

            infoDiv.innerText = `NAMA: ${inputName} | KELAS: ${student.kelas}`;
            let hasData = false;

            const examsToCheck = selectedExam === 'ALL' ? ['PPT T4', 'PAT T4', 'PPT', 'SPMC'] : [selectedExam];

            examsToCheck.forEach(examKey => {
                if (student.scores[examKey]) {
                    hasData = true;
                    const row = `<tr>
                        <td><strong>${examKey}</strong></td>
                        <td>${student.scores[examKey].m}</td>
                        <td><span class="grade-badge">${student.scores[examKey].g}</span></td>
                    </tr>`;
                    tbody.innerHTML += row;
                }
            });

            if (!hasData) {
                errorDiv.innerText = `Tiada rekod markah bagi peperiksaan: ${selectedExam}`;
                return;
            }

            resultBox.style.display = "block";
        }

        function teacherLogin() {
            const codeInput = document.getElementById('teacher-code').value;
            const errorDiv = document.getElementById('teacher-error');

            if (codeInput === SECRET_TEACHER_CODE) {
                errorDiv.innerText = "";
                document.getElementById('teacher-login-form').style.display = "none";
                document.getElementById('teacher-dashboard').style.display = "block";
                renderTeacherData();
            } else {
                errorDiv.innerText = "Kod sulit tidak sah! Sila cuba lagi.";
            }
        }

        function teacherLogout() {
            document.getElementById('teacher-code').value = "";
            document.getElementById('teacher-login-form').style.display = "block";
            document.getElementById('teacher-dashboard').style.display = "none";
        }

        function renderTeacherData() {
            const classFilter = document.getElementById('class-filter').value;
            const tbody = document.getElementById('teacher-table-body');
            tbody.innerHTML = "";

            let index = 1;
            for (const [nama, info] of Object.entries(examDatabase)) {
                if (classFilter === 'ALL' || info.kelas === classFilter) {
                    const getScoreStr = (exam) => {
                        if (info.scores[exam]) {
                            return `${info.scores[exam].m} (${info.scores[exam].g})`;
                        }
                        return '-';
                    };

                    const row = `<tr>
                        <td>${index++}</td>
                        <td style="text-align: left;">${nama}</td>
                        <td>${info.kelas}</td>
                        <td>${getScoreStr('PPT T4')}</td>
                        <td>${getScoreStr('PAT T4')}</td>
                        <td>${getScoreStr('PPT')}</td>
                        <td>${getScoreStr('SPMC')}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                }
            }
        }
    </script>
</body>
</html>
